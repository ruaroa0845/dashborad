[package]
name = "secretwatch-dashboard"
description = "SecretWatch native dashboard and in-memory display state"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version = "1.90"

[dependencies]
askfile.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono = { version = "0.4", features = ["clock", "serde"] }

[target.'cfg(windows)'.dependencies]
eframe = { version = "=0.33.0", default-features = false, features = ["default_fonts", "glow"] }
windows = { workspace = true, features = ["Win32_UI_WindowsAndMessaging", "Win32_System_Time", "Win32_System_Threading"] }
